name: Live

# Calls every tool against the real Digikala API once a day, so an upstream change shows up
# as a red badge before users report it.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run pytest -m live -q
