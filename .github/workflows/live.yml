name: Live

# Calls every tool against the real Digikala API, on demand. Not scheduled: from GitHub's US runners
# Digikala times out or answers inconsistently on a few calls each run (2026-10-05), so a daily run would
# be red for no real reason. The same tests pass from an Iranian connection.
on:
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run pytest -m live -q
